plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods must target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ModDevGradle registers only the NeoForged and Mojang repositories. JUnit
// lives on Central; the protocol, until it has a real repository, on Local.
repositories {
    mavenCentral()
    mavenLocal()
}

// Three layers, one direction of dependency:
//
//   domain   <--  main (adapters)  <--  gametest (a real server)
//     ^
//     +----  test (plain JUnit; no Minecraft on its classpath at all)
//
// `domain` is the pure layer: the decisions this mod makes -- when a held
// trigger fires, what a reload loads, how recoil recovers -- over plain
// numbers and booleans. It is compiled against nothing but the JDK, so a
// `net.minecraft` import there is a compile error rather than something a
// reviewer has to catch. `gametest` is the only source set besides `main`
// that receives the modding dependencies; `test` never does.
sourceSets {
    domain
    gametest
}

// In a dev run SharedConstants.IS_RUNNING_IN_IDE is true, so the structure
// template manager reads gametest templates from <cwd>/gameteststructures/
// rather than from a resource pack. The templates are kept under devtools/
// and copied into place before the run.
var copyGameTestStructures = tasks.register("copyGameTestStructures", Copy) {
    from "devtools/gameteststructures"
    into "run/gameteststructures"
}

// The world the gametest server leaves behind, as a singleplayer save for
// the photo booth to quick-play into. Copies nothing until a gametest run
// has happened.
// The booth has its own game directory, run/booth: its saves and
// screenshots stay apart from the test runs', and its mods/ folder holds
// whatever of the pack should be in the picture (Not Enough Animations and
// its library, which re-pose the player) -- jars dropped there load, where
// jars on the classpath are not discovered as mods by a dev launch.
var prepareBoothWorld = tasks.register("prepareBoothWorld", Copy) {
    from "run/world"
    into "run/booth/saves/booth"
    exclude "session.lock"
}

// Datagen only rewrites what it generates; a renamed recipe would leave its
// old file behind. Every run starts from nothing.
var cleanGeneratedResources = tasks.register("cleanGeneratedResources", Delete) {
    delete "src/generated/resources"
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // A dedicated server with NeoForge's gametest framework enabled; it
        // runs every @GameTest in the enabled namespaces and exits with the
        // number of failed required tests. `type` maps straight onto the run
        // type name NeoForge publishes.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            taskBefore copyGameTestStructures
        }
        // Eyes for the art: a client that loads the gametest server's world
        // (copied to a save by prepareBoothWorld), puts the gun in hand,
        // screenshots it from several angles and quits -- see PhotoBooth in
        // the gametest source set. Needs a display; never part of check.
        photoBooth {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/booth')
            systemProperty 'rangedweaponsmod.photobooth', 'true'
            // -PboothPose=one photographs the calibration items in the
            // one-handed pose, for a pistol's frame; two-handed otherwise.
            systemProperty 'rangedweaponsmod.booth.pose', project.findProperty('boothPose') ?: 'two'
            // -PboothReference=<item id> photographs another mod's item (its
            // jar dropped in run/booth/mods) in the same views, to compare by eye.
            systemProperty 'rangedweaponsmod.booth.reference', project.findProperty('boothReference') ?: ''
            programArguments.addAll('--quickPlaySingleplayer', 'booth')
            taskBefore prepareBoothWorld
        }
        // Data generation: the recipes and their recipe-book unlocks are
        // written from the domain's blueprints into src/generated/resources,
        // a resource root of main that is committed like the generated art.
        // `--mod` says whose GatherDataEvent runs, `--all` every generator
        // kind, `--existing` lets generated files reference hand-written
        // ones. The output path is resolved against the working directory,
        // so it is absolute. Never part of check: the crafting gametests
        // assert the committed output agrees with the blueprints.
        data {
            data()
            gameDirectory = file('run/data')
            taskBefore cleanGeneratedResources
            programArguments.addAll('--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath)
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.domain)
            sourceSet(sourceSets.main)
        }
        // The gametests are a mod of their own with their own datapack: a
        // mod's several resource roots cannot each supply a file at one path,
        // and the tests want data-map entries beside the ones this jar ships.
        // It also makes them exercise the mod from outside, as a pack would.
        "${mod_id}_gametest" {
            sourceSet(sourceSets.gametest)
        }
    }

    // Deliberately not `domain` and not `test` -- see the layering comment.
    addModdingDependenciesTo(sourceSets.gametest)
}

// The gametest mod is for the gametest run and the photo booth only.
neoForge.runs.matching { it.name != 'gameTestServer' && it.name != 'photoBooth' }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != "${mod_id}_gametest" }
}

// The gametest run's classpath is gametest.runtimeClasspath; inheriting
// main's configurations is what puts the nested protocol mod on it.
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // The ranged-weapon protocol: compiled against, and nested Jar-in-Jar so
    // the pack needs no separate jar. The loader deduplicates nested copies
    // across every mod that carries it.
    jarJar(implementation("com.nfx.rangedweapons:rangedweapons")) {
        version {
            strictly "[1.5,2.0)"
            prefer "1.5.0"
        }
    }

    implementation sourceSets.domain.output

    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output

    // Plain JUnit 5 against the pure layer only. Gradle 9 no longer injects
    // the platform launcher, so it is declared.
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher:1.9.2'
}

tasks.named('test', Test) {
    // Gradle enables -ea for Test tasks by default; the domain layer's rep
    // invariants are `assert`s and rely on it.
    useJUnitPlatform()
}

// The shipped jar is main + domain. gametest is never shipped.
jar {
    from sourceSets.domain.output
}

// The gametest server's exit code is the number of failed *required* tests,
// which is also zero when no test ran at all -- a mod the loader refused, a
// namespace typo, an empty holder class. So the exit code is not the
// assertion. The assertion is the framework's own summary line in the log,
// and the task fails without it. `check` runs the gate unless asked not to
// (`-PskipGameTests`) for fast iteration on the pure tests.
tasks.named('runGameTestServer') { task ->
    // Resolved now, not in the action: the configuration cache forbids the
    // action from touching the project.
    def logFile = layout.projectDirectory.file('run/logs/latest.log').asFile
    task.doLast {
        def text = logFile.exists() ? logFile.text : ''
        if (text =~ /Missing or unsupported mandatory|Mod loading has failed/) {
            throw new GradleException("gametest: the loader refused a mod; see ${logFile}")
        }
        def passed = (text =~ /All (\d+) required tests passed/)
        if (!passed.find()) {
            throw new GradleException("gametest: no 'required tests passed' line in ${logFile}")
        }
        task.logger.lifecycle("gametest: all ${passed.group(1)} required tests passed")
    }
}
if (!project.hasProperty('skipGameTests')) {
    tasks.named('check') {
        dependsOn 'runGameTestServer'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// The generated datapack ships; datagen's own hash cache does not.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
